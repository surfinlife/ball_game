<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>玉転がし迷路ゲーム</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      min-height: 100vh;
      color: #fff;
      transition: background 0.8s ease;
    }

    /* ===== ステージテーマ: body背景 ===== */
    body.theme-jungle {
      background: linear-gradient(160deg, #0a2e0a 0%, #1a5c1a 50%, #0d3b0d 100%);
    }
    body.theme-mario {
      background: linear-gradient(160deg, #1a6bd4 0%, #4aa3f5 50%, #1a6bd4 100%);
    }
    body.theme-sky {
      background: linear-gradient(180deg, #87ceeb 0%, #b0e0ff 60%, #e0f4ff 100%);
      color: #1a3a5c;
    }
    body.theme-space {
      background: radial-gradient(ellipse at center, #0d0d2b 0%, #000010 60%, #000 100%);
    }
    body.theme-oni {
      background: linear-gradient(160deg, #1a0000 0%, #4a0a00 50%, #2a0000 100%);
    }

    /* ===== タイトル ===== */
    h1 {
      margin: 10px 0 4px;
      font-size: 22px;
      letter-spacing: 2px;
      transition: all 0.5s;
    }
    body.theme-jungle h1 { color: #7fff7f; text-shadow: 0 0 16px #00aa00, 0 2px 4px #000; font-family: Georgia, serif; }
    body.theme-mario  h1 { color: #ffe000; text-shadow: 2px 2px 0 #c00, 4px 4px 0 #800; font-family: 'Courier New', monospace; letter-spacing: 3px; }
    body.theme-sky    h1 { color: #1a5fa0; text-shadow: 0 2px 8px rgba(255,255,255,0.8); }
    body.theme-space  h1 { color: #aaddff; text-shadow: 0 0 20px #00aaff, 0 0 40px #0066ff; }
    body.theme-oni    h1 { color: #ff4400; text-shadow: 0 0 20px #ff2200, 2px 2px 0 #000; font-family: serif; }

    /* ===== HUD ===== */
    #hud {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 4px 0;
      font-size: 13px;
    }
    .hud-item {
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
    }
    .hud-item span { font-weight: bold; }
    body.theme-jungle .hud-item span { color: #7fff7f; }
    body.theme-mario  .hud-item span { color: #ffe000; }
    body.theme-sky    .hud-item span { color: #1a5fa0; }
    body.theme-space  .hud-item span { color: #aaddff; }
    body.theme-oni    .hud-item span { color: #ff8800; }
    body.theme-sky    .hud-item { background: rgba(255,255,255,0.4); border-color: rgba(100,150,200,0.4); }

    #themeLabel {
      font-size: 12px;
      opacity: 0.8;
      margin: 2px 0;
      letter-spacing: 1px;
    }
    #info { font-size: 11px; color: inherit; opacity: 0.65; margin: 2px 0; }

    /* ===== ゲームフィールド ===== */
    #game {
      position: relative;
      width: 90vw;
      height: 90vw;
      max-width: 400px;
      max-height: 400px;
      margin: 6px auto;
      border-radius: 6px;
      overflow: hidden;
      transition: background 0.8s, border-color 0.5s, box-shadow 0.5s;
    }

    /* ジャングル：土と草のフィールド */
    body.theme-jungle #game {
      background:
        radial-gradient(ellipse 30px 30px at 10% 20%, rgba(0,80,0,0.3) 0%, transparent 70%),
        radial-gradient(ellipse 40px 20px at 80% 70%, rgba(0,60,0,0.25) 0%, transparent 70%),
        radial-gradient(ellipse 25px 35px at 50% 40%, rgba(10,50,0,0.2) 0%, transparent 70%),
        linear-gradient(160deg, #3a7a1a 0%, #2a6010 40%, #4a8a20 70%, #2a5a10 100%);
      border: 5px solid #1a4a00;
      box-shadow: 0 0 30px rgba(0,150,0,0.5), inset 0 0 20px rgba(0,0,0,0.3);
    }

    /* マリオ：ブロック模様の青空フィールド */
    body.theme-mario #game {
      background:
        repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(0,0,0,0.06) 20px),
        repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(0,0,0,0.06) 20px),
        linear-gradient(180deg, #5bc0f5 0%, #4ab0e5 100%);
      border: 6px solid #8B4513;
      box-shadow: 0 0 0 3px #4a2000, 0 6px 20px rgba(0,0,0,0.5);
    }

    /* 空：雲と空のフィールド */
    body.theme-sky #game {
      background:
        radial-gradient(ellipse 80px 40px at 20% 30%, rgba(255,255,255,0.8) 0%, transparent 70%),
        radial-gradient(ellipse 60px 30px at 70% 15%, rgba(255,255,255,0.7) 0%, transparent 70%),
        radial-gradient(ellipse 50px 25px at 55% 60%, rgba(255,255,255,0.6) 0%, transparent 70%),
        linear-gradient(180deg, #87ceeb 0%, #b0e8ff 50%, #d0f0ff 100%);
      border: 4px solid #5aa0d0;
      box-shadow: 0 8px 30px rgba(100,160,255,0.4), inset 0 0 20px rgba(255,255,255,0.2);
    }

    /* 宇宙：星空フィールド */
    body.theme-space #game {
      background:
        radial-gradient(1px 1px at 10% 20%, white, transparent),
        radial-gradient(1px 1px at 30% 50%, white, transparent),
        radial-gradient(1px 1px at 50% 10%, white, transparent),
        radial-gradient(1px 1px at 70% 70%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 85% 35%, white, transparent),
        radial-gradient(2px 2px at 20% 80%, rgba(200,200,255,0.9), transparent),
        radial-gradient(1px 1px at 60% 90%, white, transparent),
        radial-gradient(1px 1px at 40% 65%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 90% 10%, white, transparent),
        radial-gradient(1px 1px at 15% 45%, rgba(255,255,255,0.8), transparent),
        linear-gradient(135deg, #000020 0%, #0a0025 50%, #050015 100%);
      border: 4px solid #2244aa;
      box-shadow: 0 0 40px rgba(50,100,255,0.4), inset 0 0 30px rgba(0,0,50,0.5);
    }

    /* 鬼ヶ島：溶岩・炎フィールド */
    body.theme-oni #game {
      background:
        radial-gradient(ellipse 60px 30px at 30% 85%, rgba(255,80,0,0.5) 0%, transparent 70%),
        radial-gradient(ellipse 40px 20px at 75% 90%, rgba(255,120,0,0.4) 0%, transparent 70%),
        radial-gradient(ellipse 50px 25px at 10% 95%, rgba(255,60,0,0.4) 0%, transparent 70%),
        linear-gradient(180deg, #2a0000 0%, #3a0500 40%, #1a0000 70%, #4a0800 100%);
      border: 5px solid #600000;
      box-shadow: 0 0 40px rgba(255,50,0,0.5), inset 0 0 20px rgba(200,0,0,0.2);
    }

    /* ===== ボール ===== */
    .ball {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      z-index: 10;
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    }
    .ball.falling { opacity: 0; transform: scale(0.1); }

    body.theme-jungle .ball {
      background: radial-gradient(circle at 35% 35%, #c8a040, #7a5010);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.5);
    }
    body.theme-mario .ball {
      background: radial-gradient(circle at 35% 35%, #ff6666, #cc0000);
      box-shadow: 2px 2px 0 #800, inset -2px -2px 4px rgba(0,0,0,0.3);
      border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
    }
    body.theme-sky .ball {
      background: radial-gradient(circle at 35% 35%, #fffbe0, #f0c020);
      box-shadow: 0 0 12px rgba(255,220,0,0.8), 2px 2px 4px rgba(0,0,0,0.2);
    }
    body.theme-space .ball {
      background: radial-gradient(circle at 35% 35%, #aaddff, #0066cc);
      box-shadow: 0 0 14px rgba(100,200,255,0.9), 0 0 28px rgba(0,100,255,0.5);
    }
    body.theme-oni .ball {
      background: radial-gradient(circle at 35% 35%, #ffe0a0, #c08000);
      box-shadow: 0 0 10px rgba(255,200,0,0.7), 2px 2px 4px rgba(0,0,0,0.5);
    }

    /* ===== ゴール ===== */
    .goal {
      position: absolute;
      width: 30px;
      height: 30px;
      z-index: 5;
    }

    body.theme-jungle .goal {
      background: radial-gradient(circle at 40% 35%, #ffe060, #cc9900);
      border: 2px solid #aa7700;
      border-radius: 4px;
      box-shadow: 0 0 14px rgba(255,200,0,0.7);
      animation: goalPulse 1.5s ease-in-out infinite;
    }
    body.theme-mario .goal {
      background: linear-gradient(135deg, #ffe040, #ff8800);
      border: 3px solid #cc5500;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255,180,0,0.8);
      animation: goalSpin 2s linear infinite;
    }
    body.theme-sky .goal {
      background: linear-gradient(135deg, #ff9900, #ffdd00, #ff9900);
      border: 2px solid #cc7700;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      box-shadow: 0 0 20px rgba(255,200,0,0.9);
      animation: goalPulse 1.5s ease-in-out infinite;
    }
    body.theme-space .goal {
      background: radial-gradient(circle, #ffffff 0%, #ffff80 40%, #ffaa00 80%);
      border: none;
      border-radius: 50%;
      box-shadow: 0 0 20px #fff, 0 0 40px #ffaa00, 0 0 60px rgba(255,150,0,0.5);
      animation: goalGlow 1s ease-in-out infinite alternate;
    }
    body.theme-oni .goal {
      background: linear-gradient(135deg, #8B0000, #cc2200, #8B0000);
      border: 3px solid #ff4400;
      border-radius: 4px;
      box-shadow: 0 0 16px rgba(255,80,0,0.8), inset 0 0 8px rgba(255,200,0,0.3);
      animation: goalFire 0.8s ease-in-out infinite alternate;
    }

    @keyframes goalPulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes goalSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes goalGlow {
      from { box-shadow: 0 0 15px #fff, 0 0 30px #ffaa00; }
      to   { box-shadow: 0 0 30px #fff, 0 0 60px #ff6600, 0 0 80px rgba(255,100,0,0.4); }
    }
    @keyframes goalFire {
      from { box-shadow: 0 0 10px rgba(255,80,0,0.6); transform: scaleY(1); }
      to   { box-shadow: 0 0 25px rgba(255,80,0,0.9), 0 -5px 15px rgba(255,200,0,0.5); transform: scaleY(1.05); }
    }

    /* ===== 穴 ===== */
    .hole {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
    }

    body.theme-jungle .hole {
      background: radial-gradient(circle, #000 0%, #1a0a00 50%, #3a1a00 100%);
      box-shadow: inset 2px 2px 10px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);
    }
    body.theme-mario .hole {
      background: radial-gradient(circle, #000 0%, #111 60%, #333 100%);
      box-shadow: inset 3px 3px 8px rgba(0,0,0,1), 0 2px 0 #555;
      border-radius: 4px;
    }
    body.theme-sky .hole {
      background: radial-gradient(circle, #1a3a6a 0%, #2a4a8a 60%, #3a5a9a 100%);
      box-shadow: inset 2px 2px 8px rgba(0,0,0,0.6);
    }
    body.theme-space .hole {
      background: radial-gradient(circle, #000 0%, #050010 50%, #100030 100%);
      box-shadow: inset 0 0 10px rgba(100,0,255,0.8), 0 0 15px rgba(80,0,200,0.5);
    }
    body.theme-oni .hole {
      background: radial-gradient(circle, #ff4400 0%, #cc2200 40%, #400000 80%);
      box-shadow: inset 0 0 8px rgba(255,100,0,0.8), 0 0 12px rgba(255,50,0,0.6);
      animation: holeFire 0.6s ease-in-out infinite alternate;
    }
    @keyframes holeFire {
      from { box-shadow: inset 0 0 6px rgba(255,80,0,0.7), 0 0 8px rgba(255,50,0,0.4); }
      to   { box-shadow: inset 0 0 14px rgba(255,150,0,0.9), 0 0 20px rgba(255,80,0,0.7); }
    }

    /* ===== 壁 ===== */
    .wall {
      position: absolute;
      border-radius: 2px;
    }

    body.theme-jungle .wall {
      background: repeating-linear-gradient(
        90deg,
        #5a2d00 0px, #5a2d00 8px,
        #4a2500 8px, #4a2500 10px
      );
      border-top: 2px solid #8a5020;
      border-bottom: 2px solid #3a1800;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.5);
    }
    body.theme-mario .wall {
      background: repeating-linear-gradient(
        0deg,
        #c0522a 0px, #c0522a 9px,
        #8B3520 9px, #8B3520 10px
      );
      background-size: 20px 10px;
      border: 2px solid #6a2a10;
      box-shadow: 3px 3px 0 #3a1000;
      image-rendering: pixelated;
    }
    body.theme-sky .wall {
      background: linear-gradient(145deg, #fff 0%, #e0e8f0 50%, #c8d8e8 100%);
      border: 2px solid rgba(100,150,200,0.5);
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(100,150,200,0.3), inset 0 1px 3px rgba(255,255,255,0.8);
    }
    body.theme-space .wall {
      background: linear-gradient(145deg, #334466 0%, #223355 50%, #112244 100%);
      border: 1px solid #4466aa;
      box-shadow: 0 0 8px rgba(50,100,200,0.4), inset 0 1px 2px rgba(100,150,255,0.3);
    }
    body.theme-oni .wall {
      background: repeating-linear-gradient(
        90deg,
        #1a1a1a 0px, #1a1a1a 8px,
        #0a0a0a 8px, #0a0a0a 10px
      );
      border: 1px solid #440000;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.8), 0 0 6px rgba(255,50,0,0.2);
    }

    /* ===== タイマーバー ===== */
    #timerBar {
      position: absolute;
      top: 0; left: 0;
      height: 5px;
      transition: width 1s linear;
      z-index: 15;
    }
    body.theme-jungle #timerBar { background: linear-gradient(90deg, #00ff00, #ffff00, #ff4400); }
    body.theme-mario  #timerBar { background: linear-gradient(90deg, #ffe000, #ff8800, #ff0000); border-bottom: 2px solid #8B0000; }
    body.theme-sky    #timerBar { background: linear-gradient(90deg, #00aaff, #88ddff, #ffaa00); }
    body.theme-space  #timerBar { background: linear-gradient(90deg, #4400ff, #0088ff, #00ffff); box-shadow: 0 0 8px #0088ff; }
    body.theme-oni    #timerBar { background: linear-gradient(90deg, #ffaa00, #ff4400, #aa0000); box-shadow: 0 0 8px #ff2200; }

    /* ===== ステージバナー ===== */
    #stageBanner {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      font-weight: bold;
      padding: 10px 24px;
      border-radius: 10px;
      z-index: 20;
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }
    body.theme-jungle #stageBanner { color: #7fff7f; background: rgba(0,30,0,0.8); border: 2px solid #00aa00; font-family: Georgia, serif; }
    body.theme-mario  #stageBanner { color: #ffe000; background: rgba(0,0,0,0.7); border: 3px solid #ff4400; font-family: 'Courier New', monospace; }
    body.theme-sky    #stageBanner { color: #1a3a6a; background: rgba(255,255,255,0.85); border: 2px solid #5aaad0; }
    body.theme-space  #stageBanner { color: #aaddff; background: rgba(0,0,40,0.85); border: 1px solid #4466ff; box-shadow: 0 0 20px rgba(50,100,255,0.5); }
    body.theme-oni    #stageBanner { color: #ff8800; background: rgba(40,0,0,0.9); border: 2px solid #cc2200; font-family: serif; }

    /* ===== コントロール ===== */
    #controls { margin: 5px 0; display: none; }
    .control-row { display: flex; justify-content: center; gap: 4px; margin: 2px 0; }
    .control-btn {
      padding: 8px 14px;
      font-size: 16px;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      min-width: 42px;
      transition: background 0.3s;
    }
    body.theme-jungle .control-btn { background: #2a6010; border: 1px solid #7fff7f; box-shadow: 0 3px 0 #0a3000; }
    body.theme-mario  .control-btn { background: #c84000; border: 2px solid #ffe000; box-shadow: 0 4px 0 #6a1000; border-radius: 4px; font-family: monospace; font-weight: bold; }
    body.theme-sky    .control-btn { background: #4a90d0; border: 2px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.2); border-radius: 20px; color: white; }
    body.theme-space  .control-btn { background: rgba(30,60,120,0.8); border: 1px solid #4466ff; box-shadow: 0 0 8px rgba(50,100,255,0.4); }
    body.theme-oni    .control-btn { background: #6a0000; border: 2px solid #ff4400; box-shadow: 0 3px 0 #2a0000; }
    .control-btn:active, .control-btn.pressed { opacity: 0.7; transform: translateY(2px); }

    /* ===== オーバーレイ ===== */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #overlay.hidden { display: none; }

    .overlay-box {
      border-radius: 16px;
      padding: 28px 36px;
      max-width: 320px;
      width: 85vw;
      transition: all 0.5s;
    }
    body.theme-jungle .overlay-box { background: linear-gradient(145deg, #0a2a0a, #1a4a10); border: 2px solid #00aa00; box-shadow: 0 0 30px rgba(0,180,0,0.3); }
    body.theme-mario  .overlay-box { background: linear-gradient(145deg, #0040aa, #0020aa); border: 4px solid #ffe000; box-shadow: 0 0 0 2px #c00, 6px 6px 0 #000; border-radius: 4px; }
    body.theme-sky    .overlay-box { background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(220,240,255,0.95)); border: 2px solid #5aaad0; box-shadow: 0 8px 32px rgba(100,160,255,0.3); color: #1a3a6a; }
    body.theme-space  .overlay-box { background: linear-gradient(145deg, #000030, #000a30); border: 1px solid #2244aa; box-shadow: 0 0 40px rgba(30,80,255,0.3); }
    body.theme-oni    .overlay-box { background: linear-gradient(145deg, #200000, #3a0000); border: 2px solid #cc2200; box-shadow: 0 0 30px rgba(255,50,0,0.3); }

    .overlay-box h2 { margin: 0 0 10px; font-size: 20px; }
    body.theme-jungle .overlay-box h2 { color: #7fff7f; font-family: Georgia, serif; }
    body.theme-mario  .overlay-box h2 { color: #ffe000; font-family: 'Courier New', monospace; text-shadow: 2px 2px 0 #c00; }
    body.theme-sky    .overlay-box h2 { color: #1a5fa0; }
    body.theme-space  .overlay-box h2 { color: #aaddff; text-shadow: 0 0 10px #0088ff; }
    body.theme-oni    .overlay-box h2 { color: #ff4400; font-family: serif; text-shadow: 0 0 10px #ff2200; }

    .overlay-box p { margin: 6px 0; font-size: 13px; }
    body.theme-sky    .overlay-box p { color: #1a3a6a; }
    .overlay-box p { color: #ccc; }

    .big-score {
      font-size: 38px;
      font-weight: bold;
      margin: 8px 0;
    }
    body.theme-jungle .big-score { color: #ffe000; text-shadow: 0 0 10px #aa8800; }
    body.theme-mario  .big-score { color: #ffe000; text-shadow: 2px 2px 0 #c00; }
    body.theme-sky    .big-score { color: #ff8800; }
    body.theme-space  .big-score { color: #aaddff; text-shadow: 0 0 20px #0088ff; }
    body.theme-oni    .big-score { color: #ff8800; text-shadow: 0 0 10px #ff4400; }

    .btn {
      padding: 12px 28px;
      font-size: 15px;
      margin-top: 14px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      transition: transform 0.1s;
    }
    body.theme-jungle .btn { background: #2a6010; color: #7fff7f; border: 2px solid #7fff7f; border-radius: 4px; }
    body.theme-mario  .btn { background: #c84000; color: #ffe000; border: 3px solid #ffe000; border-radius: 4px; font-family: monospace; box-shadow: 3px 3px 0 #000; }
    body.theme-sky    .btn { background: linear-gradient(145deg, #4a90d0, #2a70b0); color: white; border-radius: 30px; box-shadow: 0 4px 12px rgba(0,100,200,0.3); }
    body.theme-space  .btn { background: rgba(30,60,140,0.9); color: #aaddff; border: 1px solid #4466ff; box-shadow: 0 0 12px rgba(50,100,255,0.3); }
    body.theme-oni    .btn { background: #6a0000; color: #ff8800; border: 2px solid #ff4400; border-radius: 4px; font-family: serif; }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(1px); }

    /* 装飾要素 */
    .deco {
      position: absolute;
      pointer-events: none;
      z-index: 1;
      font-size: 18px;
      opacity: 0.35;
    }
  </style>
</head>
<body class="theme-jungle">

<h1 id="gameTitle">🌿 玉転がし迷路ゲーム 🌿</h1>

<div id="hud">
  <div class="hud-item">ステージ <span id="stageNum">-</span></div>
  <div class="hud-item">スコア <span id="scoreNum">0</span></div>
  <div class="hud-item">タイム <span id="timeNum">--</span></div>
</div>
<div id="themeLabel">🌴 ジャングルステージ 🌴</div>
<div id="info">矢印キーまたは下のボタンで操作しよう！</div>

<div id="controls">
  <div class="control-row">
    <button class="control-btn" data-key="ArrowUp">↑</button>
  </div>
  <div class="control-row">
    <button class="control-btn" data-key="ArrowLeft">←</button>
    <button class="control-btn" data-key="ArrowDown">↓</button>
    <button class="control-btn" data-key="ArrowRight">→</button>
  </div>
</div>

<div id="game">
  <div id="timerBar" style="width:100%"></div>
  <div class="ball" id="ball"></div>
  <div class="goal" id="goal"></div>
  <div id="stageBanner"></div>
</div>

<audio id="startSound" src="start.mp3"></audio>
<audio id="goalSound"  src="goal.mp3"></audio>
<audio id="fallSound"  src="fall.mp3"></audio>

<div id="overlay">
  <div class="overlay-box">
    <h2 id="overlayTitle">玉転がし迷路ゲーム</h2>
    <p id="overlayMsg">ゴールを目指せ！<br>穴に落ちないよう注意！<br><br>全5ステージ制覇せよ！</p>
    <div class="big-score" id="overlayScore" style="display:none"></div>
    <button class="btn" id="overlayBtn">スタート</button>
  </div>
</div>

<script>
  // ===== テーマ定義 =====
  const THEMES = [
    {
      id: 'jungle',
      name: '🌴 ジャングルステージ 🌴',
      title: '🌿 ジャングル迷路 🌿',
      bannerText: '🌴 Stage 1: ジャングル 🌴',
      goalEmoji: '💎', holeEmoji: '🕳️',
      time: 50, holes: 3,
    },
    {
      id: 'mario',
      name: '🍄 マリオワールド 🍄',
      title: '🍄 スーパー迷路ブラザーズ 🍄',
      bannerText: '🍄 Stage 2: MARIO WORLD 🍄',
      goalEmoji: '⭐', holeEmoji: '🌀',
      time: 45, holes: 4,
    },
    {
      id: 'sky',
      name: '☁️ 天空ステージ ☁️',
      title: '☁️ 空の迷路 ☁️',
      bannerText: '☁️ Stage 3: 天空 ☁️',
      goalEmoji: '🌈', holeEmoji: '🌩️',
      time: 40, holes: 4,
    },
    {
      id: 'space',
      name: '🚀 宇宙ステージ 🚀',
      title: '🌌 宇宙迷路 🌌',
      bannerText: '🚀 Stage 4: UNIVERSE 🚀',
      goalEmoji: '🌟', holeEmoji: '🕳️',
      time: 35, holes: 5,
    },
    {
      id: 'oni',
      name: '👹 鬼ヶ島ステージ 👹',
      title: '👹 鬼ヶ島の迷路 👹',
      bannerText: '👹 Stage 5: 鬼ヶ島 👹',
      goalEmoji: '🏺', holeEmoji: '🔥',
      time: 30, holes: 6,
    },
  ];

  // ===== 迷路データ =====
  const STAGE_MAZES = [
    // Stage 1 Jungle - シンプル
    [
      {x:80,  y:0,   w:12, h:130},
      {x:80,  y:130, w:110,h:12},
      {x:190, y:180, w:80, h:12},
      {x:260, y:90,  w:12, h:100},
      {x:0,   y:210, w:130,h:12},
      {x:310, y:0,   w:12, h:160},
      {x:120, y:55,  w:110,h:12},
      {x:55,  y:290, w:12, h:110},
      {x:200, y:330, w:150,h:12},
    ],
    // Stage 2 Mario - 中くらい
    [
      {x:0,   y:90,  w:150,h:12},
      {x:85,  y:0,   w:12, h:100},
      {x:170, y:90,  w:12, h:120},
      {x:170, y:200, w:130,h:12},
      {x:280, y:90,  w:12, h:120},
      {x:280, y:200, w:120,h:12},
      {x:110, y:240, w:90, h:12},
      {x:110, y:240, w:12, h:100},
      {x:55,  y:320, w:210,h:12},
      {x:250, y:240, w:12, h:90},
    ],
    // Stage 3 Sky - 雲の迷路
    [
      {x:0,   y:70,  w:110,h:12},
      {x:100, y:0,   w:12, h:80},
      {x:100, y:70,  w:12, h:100},
      {x:100, y:160, w:120,h:12},
      {x:210, y:0,   w:12, h:170},
      {x:210, y:160, w:12, h:90},
      {x:210, y:240, w:130,h:12},
      {x:320, y:90,  w:12, h:160},
      {x:320, y:90,  w:80, h:12},
      {x:0,   y:250, w:110,h:12},
      {x:100, y:290, w:12, h:110},
      {x:150, y:320, w:170,h:12},
      {x:310, y:250, w:12, h:80},
    ],
    // Stage 4 Space - 複雑な宇宙迷路
    [
      {x:0,   y:55,  w:100,h:10},
      {x:90,  y:0,   w:10, h:65},
      {x:90,  y:55,  w:10, h:75},
      {x:90,  y:120, w:110,h:10},
      {x:190, y:0,   w:10, h:130},
      {x:190, y:130, w:10, h:80},
      {x:190, y:200, w:120,h:10},
      {x:300, y:55,  w:10, h:155},
      {x:300, y:55,  w:100,h:10},
      {x:0,   y:230, w:100,h:10},
      {x:90,  y:265, w:10, h:135},
      {x:140, y:305, w:160,h:10},
      {x:290, y:230, w:10, h:85},
      {x:160, y:150, w:50, h:10},
      {x:200, y:150, w:10, h:60},
    ],
    // Stage 5 Oni - 最難関
    [
      {x:0,   y:50,  w:90, h:10},
      {x:80,  y:0,   w:10, h:60},
      {x:80,  y:50,  w:10, h:80},
      {x:80,  y:120, w:100,h:10},
      {x:170, y:0,   w:10, h:130},
      {x:170, y:120, w:10, h:60},
      {x:170, y:170, w:100,h:10},
      {x:260, y:60,  w:10, h:120},
      {x:260, y:60,  w:80, h:10},
      {x:0,   y:200, w:80, h:10},
      {x:70,  y:240, w:10, h:90},
      {x:70,  y:320, w:110,h:10},
      {x:170, y:240, w:10, h:90},
      {x:170, y:210, w:80, h:10},
      {x:240, y:190, w:10, h:80},
      {x:240, y:260, w:80, h:10},
      {x:310, y:170, w:10, h:100},
      {x:0,   y:350, w:120,h:10},
    ],
  ];

  // ===== DOM =====
  const gameEl      = document.getElementById("game");
  const ball        = document.getElementById("ball");
  const goal        = document.getElementById("goal");
  const overlay     = document.getElementById("overlay");
  const overlayBtn  = document.getElementById("overlayBtn");
  const overlayTitle= document.getElementById("overlayTitle");
  const overlayMsg  = document.getElementById("overlayMsg");
  const overlayScore= document.getElementById("overlayScore");
  const stageBanner = document.getElementById("stageBanner");
  const timerBar    = document.getElementById("timerBar");
  const stageNum    = document.getElementById("stageNum");
  const scoreNum    = document.getElementById("scoreNum");
  const timeNum     = document.getElementById("timeNum");
  const themeLabel  = document.getElementById("themeLabel");
  const gameTitle   = document.getElementById("gameTitle");
  const controls    = document.getElementById("controls");

  // ===== State =====
  let posX=50, posY=50, velocityX=0, velocityY=0;
  let walls=[], holes=[], gameRunning=false, keys={};
  let stage=1, score=0, timeLeft=0, timerId=null, overlayAction='start';
  const MAX_STAGES = 5;

  // ===== Audio =====
  function beep(freq, dur, type='sine', vol=0.25) {
    try {
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
      osc.start(); osc.stop(ctx.currentTime+dur);
    } catch(e){}
  }
  function playStart() { beep(523,0.12); setTimeout(()=>beep(659,0.12),110); setTimeout(()=>beep(784,0.22),220); }
  function playGoal()  { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.16),i*85)); }
  function playFall()  { for(let i=0;i<8;i++) setTimeout(()=>beep(600-i*55,0.06,'sawtooth'),i*22); }
  function playClear() { [523,659,784,1047,1319,1568].forEach((f,i)=>setTimeout(()=>beep(f,0.18),i*75)); }
  function tryPlay(el, fb) { if(!el){fb();return;} el.currentTime=0; el.play().catch(()=>fb()); }

  // ===== テーマ適用 =====
  function applyTheme(s) {
    const t = THEMES[s-1];
    document.body.className = 'theme-' + t.id;
    themeLabel.textContent = t.name;
    gameTitle.textContent  = t.title;
    // デコ要素削除
    document.querySelectorAll('.deco').forEach(d=>d.remove());
    // テーマ別装飾
    addDecorations(t.id);
  }

  function addDecorations(themeId) {
    const decos = {
      jungle: ['🌿','🍃','🌴','🦋','🌱','🍀'],
      mario:  ['🍄','⭐','🪙','❓','🐢','🌸'],
      sky:    ['☁️','🌤️','🕊️','✨','🌬️','🌈'],
      space:  ['⭐','🌟','💫','✨','🪐','🌙'],
      oni:    ['👹','🔥','💀','⚡','🗡️','💢'],
    };
    const list = decos[themeId] || [];
    const positions = [
      {top:'5%',left:'3%'},{top:'8%',right:'3%'},
      {bottom:'5%',left:'3%'},{bottom:'8%',right:'3%'},
    ];
    positions.forEach((pos, i) => {
      if (!list[i]) return;
      const el = document.createElement('div');
      el.className = 'deco';
      el.textContent = list[i % list.length];
      Object.assign(el.style, pos);
      document.body.appendChild(el);
    });
  }

  // ===== 迷路構築 =====
  function createMaze(idx) {
    walls.forEach(w=>w.element.remove()); walls=[];
    STAGE_MAZES[idx].forEach(d=>{
      const el = document.createElement('div');
      el.className = 'wall';
      el.style.cssText = `left:${d.x}px;top:${d.y}px;width:${d.w}px;height:${d.h}px`;
      gameEl.appendChild(el);
      walls.push({element:el, x:d.x, y:d.y, w:d.w, h:d.h});
    });
  }

  function createHoles(count) {
    holes.forEach(h=>h.element.remove()); holes=[];
    const gW=gameEl.clientWidth||400, gH=gameEl.clientHeight||400;
    let placed=0, attempts=0;
    while(placed<count && attempts<300) {
      attempts++;
      const hx=25+Math.random()*(gW-80), hy=25+Math.random()*(gH-80);
      let ok=true;
      for(const w of walls) if(!(hx+40<w.x||hx-10>w.x+w.w||hy+40<w.y||hy-10>w.y+w.h)){ok=false;break;}
      for(const h of holes) if(Math.hypot(hx-h.x,hy-h.y)<80){ok=false;break;}
      if(hx<70&&hy<70) ok=false;
      if(!ok) continue;
      const el=document.createElement('div');
      el.className='hole';
      el.style.cssText=`left:${hx}px;top:${hy}px`;
      gameEl.appendChild(el);
      holes.push({element:el, x:hx, y:hy});
      placed++;
    }
  }

  function findFreePos(w, h) {
    const gW=gameEl.clientWidth||400, gH=gameEl.clientHeight||400;
    for(let i=0;i<300;i++){
      const x=Math.random()*(gW-w), y=Math.random()*(gH-h);
      let ok=true;
      for(const wall of walls) if(!(x+w<wall.x||x>wall.x+wall.w||y+h<wall.y||y>wall.y+wall.h)){ok=false;break;}
      for(const hole of holes) if(!(x+w+12<hole.x||x-12>hole.x+30||y+h+12<hole.y||y-12>hole.y+30)){ok=false;break;}
      if(ok) return {x,y};
    }
    return {x:5,y:5};
  }

  // ===== 衝突判定 =====
  function rectOverlap(ax,ay,aw,ah,bx,by,bw,bh) { return !(ax+aw<=bx||ax>=bx+bw||ay+ah<=by||ay>=by+bh); }
  function wallHit(nx,ny) { for(const w of walls) if(rectOverlap(nx,ny,20,20,w.x,w.y,w.w,w.h)) return true; return false; }
  function holeHit(cx,cy) { for(const h of holes) if(Math.hypot(cx-(h.x+15),cy-(h.y+15))<=15) return true; return false; }

  // ===== タイマー =====
  function startTimer() {
    clearInterval(timerId);
    timerId = setInterval(()=>{
      if(!gameRunning) return;
      timeLeft--;
      timeNum.textContent = timeLeft;
      timerBar.style.width = (timeLeft/THEMES[stage-1].time*100)+'%';
      if(timeLeft<=0){ clearInterval(timerId); gameRunning=false; setTimeout(()=>showOverlay('timeout'),100); }
    }, 1000);
  }

  // ===== ゲームループ =====
  function updateBall() {
    if(!gameRunning) return;
    const force=0.5;
    if(keys['ArrowUp']   ||keys['KeyW']) velocityY-=force;
    if(keys['ArrowDown'] ||keys['KeyS']) velocityY+=force;
    if(keys['ArrowLeft'] ||keys['KeyA']) velocityX-=force;
    if(keys['ArrowRight']||keys['KeyD']) velocityX+=force;

    velocityX*=0.92; velocityY*=0.92;
    velocityX=Math.max(-6,Math.min(6,velocityX));
    velocityY=Math.max(-6,Math.min(6,velocityY));

    let nx=posX+velocityX, ny=posY+velocityY;
    if(wallHit(nx,posY)){velocityX*=-0.3;nx=posX;}
    if(wallHit(posX,ny)){velocityY*=-0.3;ny=posY;}
    if(wallHit(nx,ny)){velocityX*=-0.3;velocityY*=-0.3;nx=posX;ny=posY;}

    const gW=gameEl.clientWidth||400, gH=gameEl.clientHeight||400;
    nx=Math.max(0,Math.min(gW-20,nx)); ny=Math.max(0,Math.min(gH-20,ny));
    posX=nx; posY=ny;
    ball.style.left=posX+'px'; ball.style.top=posY+'px';

    const cx=posX+10, cy=posY+10;
    if(holeHit(cx,cy)){
      gameRunning=false; clearInterval(timerId);
      ball.classList.add('falling');
      tryPlay(document.getElementById('fallSound'),playFall);
      setTimeout(()=>showOverlay('gameover'),600); return;
    }

    const gx=parseFloat(goal.style.left), gy=parseFloat(goal.style.top);
    if(rectOverlap(posX,posY,20,20,gx,gy,30,30)){
      gameRunning=false; clearInterval(timerId);
      const bonus=timeLeft*10; score+=100+bonus;
      scoreNum.textContent=score;
      tryPlay(document.getElementById('goalSound'),playGoal);
      if(stage<MAX_STAGES) setTimeout(()=>showOverlay('stageclear'),400);
      else setTimeout(()=>{playClear();showOverlay('allclear');},400);
      return;
    }
    requestAnimationFrame(updateBall);
  }

  function handleOrientation(e) {
    if(!gameRunning) return;
    const f=0.35;
    velocityX+=Math.max(-1,Math.min(1,(e.gamma||0)/30))*f;
    velocityY+=Math.max(-1,Math.min(1,(e.beta||0)/30))*f;
  }

  // ===== ステージ開始 =====
  function setupStage(s) {
    stage=s;
    stageNum.textContent=s;
    const t=THEMES[s-1];
    timeLeft=t.time;
    timeNum.textContent=timeLeft;
    timerBar.style.transition='none';
    timerBar.style.width='100%';
    requestAnimationFrame(()=>{ timerBar.style.transition='width 1s linear'; });

    applyTheme(s);
    createMaze(s-1);
    createHoles(t.holes);

    const bp=findFreePos(20,20);
    posX=bp.x; posY=bp.y; velocityX=velocityY=0;
    ball.style.left=posX+'px'; ball.style.top=posY+'px';
    ball.classList.remove('falling');

    const gp=findFreePos(30,30);
    goal.style.left=gp.x+'px'; goal.style.top=gp.y+'px';
  }

  function beginStage(s) {
    setupStage(s);
    controls.style.display='block';
    tryPlay(document.getElementById('startSound'),playStart);
    stageBanner.textContent = THEMES[s-1].bannerText;
    stageBanner.style.display='block';
    setTimeout(()=>{
      stageBanner.style.display='none';
      gameRunning=true;
      startTimer();
      requestAnimationFrame(updateBall);
    }, 1400);
  }

  // ===== オーバーレイ =====
  function showOverlay(mode) {
    overlay.classList.remove('hidden');
    overlayScore.style.display='none';
    overlayAction=mode;
    const t=THEMES[stage-1];

    if(mode==='start') {
      overlayTitle.textContent='玉転がし迷路ゲーム';
      overlayMsg.innerHTML='ゴールを目指せ！穴に落ちるな！<br><br>🌿ジャングル → 🍄マリオ →<br>☁️空 → 🌌宇宙 → 👹鬼ヶ島<br><br>全5ステージ制覇せよ！';
      overlayBtn.textContent='スタート！';
    } else if(mode==='stageclear') {
      overlayTitle.textContent=`${t.name} クリア！`;
      overlayMsg.innerHTML=`残り時間ボーナス: <b>+${timeLeft*10}</b>pts<br>合計スコア: <b>${score}</b>pts<br><br>次は ${THEMES[stage].name}`;
      overlayBtn.textContent='次のステージへ →';
    } else if(mode==='allclear') {
      overlayTitle.textContent='🎉 全ステージクリア！ 🎉';
      overlayMsg.innerHTML='鬼ヶ島まで制覇した！<br>おめでとうございます！';
      overlayScore.style.display='block';
      overlayScore.textContent=score+' pts';
      overlayBtn.textContent='もう一度挑戦！';
    } else if(mode==='gameover') {
      overlayTitle.textContent='ゲームオーバー';
      overlayMsg.textContent='穴に落ちてしまった！';
      overlayScore.style.display='block';
      overlayScore.textContent=score+' pts';
      overlayBtn.textContent='もう一度！';
    } else if(mode==='timeout') {
      overlayTitle.textContent='タイムアウト！';
      overlayMsg.textContent='時間切れ！もう一度挑戦しよう！';
      overlayScore.style.display='block';
      overlayScore.textContent=score+' pts';
      overlayBtn.textContent='もう一度！';
    }
  }

  overlayBtn.addEventListener('click',()=>{
    overlay.classList.add('hidden');
    if(overlayAction==='start'){
      score=0; scoreNum.textContent=0;
      beginStage(1); requestDeviceOrientation();
    } else if(overlayAction==='stageclear'){
      beginStage(stage+1);
    } else {
      score=0; scoreNum.textContent=0;
      beginStage(1);
    }
  });

  function requestDeviceOrientation() {
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission()
        .then(r=>{ if(r==='granted') window.addEventListener('deviceorientation',handleOrientation); })
        .catch(()=>{});
    } else {
      window.addEventListener('deviceorientation',handleOrientation);
    }
  }

  // ===== キーボード =====
  document.addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  });
  document.addEventListener('keyup',e=>{ keys[e.code]=false; });

  // ===== タッチボタン =====
  document.querySelectorAll('.control-btn').forEach(btn=>{
    const key=btn.dataset.key;
    const press=e=>{e.preventDefault();keys[key]=true;btn.classList.add('pressed');};
    const release=e=>{e.preventDefault();keys[key]=false;btn.classList.remove('pressed');};
    btn.addEventListener('touchstart',press,{passive:false});
    btn.addEventListener('touchend',release,{passive:false});
    btn.addEventListener('mousedown',press);
    btn.addEventListener('mouseup',release);
    btn.addEventListener('mouseleave',release);
  });

  // ===== 初期表示 =====
  applyTheme(1);
  showOverlay('start');
</script>
</body>
</html>
